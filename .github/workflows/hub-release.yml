name: Hub release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish container and deployment bundle
    if: startsWith(github.event.release.tag_name, 'hub-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read release version
        id: release
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^hub-v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${identifier}(\\.${identifier})*)?$"
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "Hub release tag must use semantic versioning, such as hub-v1.2.3." >&2
            exit 1
          fi

          version=${RELEASE_TAG#hub-v}
          stable=true
          tag_prerelease=false
          if [[ "$version" == *-* ]]; then
            stable=false
            tag_prerelease=true
          fi
          if [[ "$RELEASE_PRERELEASE" != "$tag_prerelease" ]]; then
            echo "The tag and GitHub prerelease setting must agree." >&2
            exit 1
          fi

          {
            echo "stable=$stable"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/github/replica-hub
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hub
          build-contexts: learning=packages/learning
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            REPLICA_IMAGE_REVISION=${{ steps.release.outputs.revision }}
            REPLICA_IMAGE_VERSION=${{ steps.release.outputs.version }}

      - name: Package deployment bundle
        run: |
          mkdir -p hub/tmp/release
          tar -czf hub/tmp/release/replica-deploy.tar.gz -C hub/deploy compose.yml replica
          cd hub/tmp/release
          sha256sum replica-deploy.tar.gz >replica-deploy.tar.gz.sha256

      - name: Upload deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            hub/tmp/release/replica-deploy.tar.gz \
            hub/tmp/release/replica-deploy.tar.gz.sha256 \
            --clobber
