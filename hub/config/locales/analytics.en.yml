en:
  analytics:
    heading: Analytics
    configured_notice: Configured. Your settings have been saved.
    disconnected: Destination disconnected.
    invalid_configuration: Could not save. Choose a supported provider and region, select at least one event, and supply all required credentials. Only one destination per provider is allowed. For Mixpanel, use a positive whole-number project ID and a service account username without a colon.
    invalid_custom_configuration: Could not save the custom destination. Check its public HTTPS URL, nonsecret query settings, JSON body and headers, named secrets, response check, and selected events. Existing pending events were not changed.
    failures:
      http_status: The destination returned HTTP %{status}. Check its authentication and response settings.
      response_mismatch: The response did not match the configured confirmation field and value.
      response_too_large: The destination response exceeded Hub's size limit.
      unsafe_endpoint: The destination did not resolve only to allowed public addresses.
      network_error: Hub could not resolve or connect to the destination.
      invalid_payload: Hub could not render the saved request.
      invalid_response: Hub could not read the destination response.
      attempts_exhausted: Delivery stopped after the allowed retry attempts.
      unknown: Delivery failed. Check the destination settings.
    events:
      prototype_registered: Prototype added to gallery
      prototype_first_published: First successful Build published
      build_published: Subsequent successful Build published
      review_comment_created: Review conversation started
      review_reply_added: Reply added
      review_thread_resolved: Conversation resolved
      review_thread_reopened: Conversation reopened
    page:
      heading: Analytics
      description: Hub records repository activity for 90 days, even without a destination. Send selected events to your analytics provider.
      privacy: Events contain identifiers and timestamps, never comment text or prototype content. Opaque person identifiers are consistent across this Hub. No offline or local editing activity is tracked.
      destinations: Destinations
      empty: No destinations configured. Hub is still recording events.
      add: Add destination
      cancel: Cancel
      provider: Provider
      segment: Segment
      mixpanel: Mixpanel
      custom: Custom HTTP
      region: Region
      us: United States
      eu: European Union
      in: India
      write_key: Source write key
      service_account_username: Service account username
      service_account_secret: Service account secret
      project_id: Project ID
      mixpanel_help: Use a Mixpanel Owner or Admin service account authorized for this project. Hub sends one event at a time through the strict import API.
      rotation: Credentials are never displayed. Leave a field blank to keep its saved value, or enter a replacement.
      event_types: Events to send
      history: When should delivery begin?
      new_events: New events only
      retained_events: Include retained events from the last 90 days
      history_warning: Including retained events sends this repository's selected event types to the provider. They may appear in reports.
      save: Save configuration
      configured: Configured
      paused: Paused
      failed: Needs attention
      pause: Pause
      resume: Resume
      disconnect: Disconnect
      failure_help: Hub couldn't send some activity. Check your provider settings below.
      custom_name: Destination name
      custom_endpoint: Public HTTPS URL
      custom_endpoint_help: Use a public DNS name on port 443. Query settings are visible and cannot hold credentials. Hub never follows redirects.
      custom_headers: Headers (JSON object)
      custom_header_retention: Saved static header values appear as {"$keep":true}. Leave the marker unchanged to keep that header's value.
      custom_template: Request body (JSON template)
      custom_secrets: Encrypted secrets
      custom_secret_name: Secret name
      custom_secret_value: Secret value
      custom_add_secret: Add secret
      custom_success_pointer: Success response field (JSON Pointer, optional)
      custom_success_value: Expected JSON value
      custom_preview: Redacted sample request body
      custom_preview_help: Sample identifiers are made up; no request is sent. Secret references appear as redacted values.
      custom_preview_invalid: Preview unavailable. Check the JSON body.
      custom_keep_pending: Same recipient; keep pending events after changing authentication
      custom_backlog_warning: Changing the URL or request body cancels unsent events. Changing authentication also cancels them unless you confirm the same recipient. To resend retained history, disconnect and add a new destination with retained events selected.
      custom_retry_warning: Hub retries some failures with the same event ID in a header. A successful HTTP response does not prove an event appeared in reports, and the receiving service may not deduplicate retries.
      custom_endpoint_example: https://events.example.com/collect?version=1
      custom_template_example: '{"event":{"$field":"event_name"},"event_id":{"$field":"event_id"},"properties":{"$field":"properties"}}'
      custom_headers_example: '{"Authorization":{"$secret":"api_token"}}'
