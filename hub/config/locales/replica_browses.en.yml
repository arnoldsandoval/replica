en:
  replica_browses:
    show:
      heading: Default
      branch_from: "Starting from %{branch}"
      branch_instructions: |
        BRIEF-END
        Create a new prototype branch from the repository's default branch. Apply the changes above to that new branch. Do not change the default branch.
        Build an interactive working UI prototype. Use the repository's `create-prototype` skill if it is installed; otherwise follow its own instructions and conventions.
        Do not publish, commit, or push without explicit approval.
      empty_heading: Default branch preview unavailable
      states:
        unavailable: "No build has been discovered for %{branch} yet. Hub needs a successful default branch build before it can show a preview."
        queued: "The build for %{branch} is queued. Its preview will appear after the build succeeds."
        running: "The build for %{branch} is running or being imported. Its preview will appear when it is ready."
        failed: "The build for %{branch} failed. Push a new commit or check the Replica workflow and artifact storage."
        superseded: "The build for %{branch} was superseded by a newer commit. Hub is waiting for a successful build."
        successful: "The successful build for %{branch} is ready."
