# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  clear_expired_security_audit:
    command: "SecurityAuditEvent.clear_expired!"
    schedule: every hour at minute 21
  clear_expired_operator_enrollments:
    command: "HubAdminEnrollment.clear_expired!"
    schedule: every hour at minute 22
  clear_expired_fresh_authorizations:
    command: "FreshAuthorization.clear_expired!"
    schedule: every hour at minute 23
  recover_analytics_deliveries:
    command: "Analytics::Delivery.recover!"
    schedule: every minute
  recover_webhook_deliveries:
    command: "WebhookRecoveryCheckpoint.recover_all!"
    schedule: every minute
  clear_expired_webhook_history:
    command: "WebhookRedelivery.clear_expired!"
    schedule: every hour at minute 24
  clear_expired_analytics:
    command: "Analytics::Event.clear_expired!"
    schedule: every hour at minute 19
  discover_local_builds:
    command: "Repository::LocalDiscovery.refresh_all! if LocalDevelopment.enabled?"
    schedule: every 1 minute
  discover_github_builds:
    command: "GithubAppConfiguration.current&.discover_builds_later! if !LocalDevelopment.enabled?"
    schedule: every 5 minutes
  retry_github_build_imports:
    command: "Build.import_package_later_bulk!(Build.awaiting_import) if !LocalDevelopment.enabled?"
    schedule: every 5 minutes
  backfill_commit_authors:
    command: "Build::CommitAuthor.request_missing! if !LocalDevelopment.enabled?"
    schedule: every 5 minutes
  clear_expired_preview_grants:
    command: "PreviewGrant.clear_expired!"
    schedule: every hour at minute 42
  clear_expired_canvas_pairings:
    command: "CanvasPairing.clear_expired!"
    schedule: every hour at minute 43
  clear_expired_canvas_grants:
    command: "CanvasGrant.clear_expired!"
    schedule: every hour at minute 44
  clear_expired_share_preview_grants:
    command: "SharePreviewGrant.clear_expired!"
    schedule: every hour at minute 47
  clear_expired_share_links:
    command: "ShareLink.clear_expired!"
    schedule: every day at 02:17
  find_learnings:
    command: "Learning::Run.schedule_all!"
    schedule: every day at 04:07
  clear_expired_learning_runs:
    command: "Learning::Run.clear_expired!"
    schedule: every hour at minute 48
  recover_learning_removals:
    command: "ReviewComment.recover_learning_removals!"
    schedule: every 15 minutes

