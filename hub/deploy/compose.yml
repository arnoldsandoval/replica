name: replica-hub

services:
  hub:
    image: ${REPLICA_IMAGE:-ghcr.io/github/replica-hub:1}
    env_file: .env
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "1"
    ports:
      - "127.0.0.1:${REPLICA_PORT:-3000}:80"
    volumes:
      - replica-data:/rails/storage
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  replica-data:
